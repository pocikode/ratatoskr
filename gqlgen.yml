# gqlgen configuration (docs/03-architecture.md §6). Run with `make gen`.
# Resolvers are hand-written in internal/api/graphql/resolvers, so there is no
# `resolver:` section: gqlgen only generates the executor and the models.
schema:
  - internal/api/graphql/schema/*.graphqls

exec:
  filename: internal/api/graphql/generated/exec.go
  package: generated

model:
  filename: internal/api/graphql/generated/models.go
  package: generated

omit_slice_element_pointers: true
omit_getters: true
skip_mod_tidy: true

models:
  ID:
    model:
      - github.com/99designs/gqlgen/graphql.ID
  Time:
    model:
      - github.com/pocikode/ratatoskr/internal/api/graphql/scalars.Time
  Bytes:
    model:
      - github.com/pocikode/ratatoskr/internal/api/graphql/scalars.Bytes
  Int64:
    model:
      - github.com/pocikode/ratatoskr/internal/api/graphql/scalars.Int64

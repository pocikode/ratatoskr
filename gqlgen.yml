# gqlgen configuration (docs/03-architecture.md §6). Run with `make gen`.
# Resolvers are hand-written in internal/api/graphql/resolvers, so there is no
# `resolver:` section: gqlgen only generates the executor and the models.
schema:
  - internal/api/graphql/schema/*.graphqls

exec:
  filename: internal/api/graphql/generated/exec.go
  package: generated

model:
  filename: internal/api/graphql/generated/models.go
  package: generated

omit_slice_element_pointers: true
omit_getters: true
skip_mod_tidy: true

models:
  ID:
    model:
      - github.com/99designs/gqlgen/graphql.ID
  Time:
    model:
      - github.com/pocikode/ratatoskr/internal/api/graphql/scalars.Time
  Bytes:
    model:
      - github.com/pocikode/ratatoskr/internal/api/graphql/scalars.Bytes
  Int64:
    model:
      - github.com/pocikode/ratatoskr/internal/api/graphql/scalars.Int64
  # Loaded lazily by field resolvers so list queries do not read raw bytes.
  HttpRequest:
    fields:
      head: { resolver: true }
      body: { resolver: true }
      editedFrom: { resolver: true }
      editedBy: { resolver: true }
  HttpResponse:
    fields:
      head: { resolver: true }
      body: { resolver: true }
    # Field resolvers get only the parent model; the response row is keyed by its request.
    extraFields:
      RequestID:
        type: int64
        description: ID of the request this response belongs to; not exposed in the schema.
  # `scopeId: null` clears the scope while an omitted field keeps it (F-INT-1).
  InterceptSettingsInput:
    fields:
      scopeId: { omittable: true }
  # Replay graph edges load lazily, so collection lists do not read every session's entries (T-098).
  ReplayCollection:
    fields:
      sessions: { resolver: true }
  ReplaySession:
    fields:
      collection: { resolver: true }
      entries: { resolver: true }
      requestTarget: { resolver: true }
  ReplayEntry:
    fields:
      request: { resolver: true }
  # The rule's collection is a back-reference; it loads lazily to keep the model acyclic (T-099).
  MatchReplaceRule:
    fields:
      collection: { resolver: true }
    extraFields:
      CollectionID:
        type: string
        description: ID of the collection holding the rule; not exposed in the schema.

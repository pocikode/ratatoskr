"""
Raw bytes, serialized as standard base64 with padding (RFC 4648 §4). Used for
message bytes so that nothing is lost to text decoding.
"""
scalar Bytes

"""One autocomplete suggestion."""
type Completion {
  """
  Short secondary text, e.g. the field type or a value's occurrence count; empty when none.
  """
  detail: String!

  """Text that replaces `QueryCompletions.from`..`to`."""
  insertText: String!

  """
  Whether this is a Ratatoskr extension beyond the HTTPQL-compatible language (docs/04 §2).
  """
  isExtension: Boolean!

  """What the completion inserts; clients use it for the icon."""
  kind: CompletionKind!

  """Text shown in the list."""
  label: String!
}

"""What a completion inserts."""
enum CompletionKind {
  """A field such as `host` or `header`."""
  FIELD

  """`req`, `resp`, `row`, `ws`, `stream`."""
  NAMESPACE

  """An operator such as `eq` or `cont`."""
  OPERATOR

  """A filter preset name or alias, after `preset:`."""
  PRESET

  """
  A value: distinct values from the project, booleans, sources, and so on.
  """
  VALUE
}

"""
A new session: either copied from a history request (`fromRequestId`) or from
scratch (`connection` and `raw`). Giving both or neither is `BAD_INPUT`.
"""
input CreateReplaySessionInput {
  """
  Collection to add the session to, placed last; null for the Default collection.
  """
  collectionId: ID

  """Connection for a session from scratch."""
  connection: ReplayConnectionInput

  """
  History request to copy: its stored request bytes and connection. `NOT_FOUND`
  when unknown; `BAD_INPUT` when its stored request was truncated or is larger
  than 16 MiB (checked before the body is read).
  """
  fromRequestId: ID

  """Name; null for `METHOD path` (see `ReplaySession.name`)."""
  name: String

  """
  Request bytes for a session from scratch. The URL dialog sends
  `GET <path> HTTP/1.1` with a `Host` header.
  """
  raw: Bytes
}

"""
A set of variables. Lookup for `{{name}}` uses the selected project
environment, then Global. Unknown names stay verbatim; substituted values are
not interpolated again.
"""
type Environment implements Node {
  """Opaque identifier; Global has the same ID in every project."""
  id: ID!

  """
  Whether this is the instance-wide Global environment (cannot be renamed or deleted).
  """
  isGlobal: Boolean!

  """
  Display name: trimmed, 1-200 characters, unique per project. `Global` is
  reserved for the instance-wide environment.
  """
  name: String!

  """
  Whether this project environment is the selected one; at most one is. Always
  false for Global, which is always used after the selected environment.
  """
  selected: Boolean!

  """Variables in the order last set by `setEnvironmentVariables`."""
  variables: [EnvironmentVariable!]!
}

"""One variable, used as `{{name}}` in Replay, Automate and workflows."""
type EnvironmentVariable {
  """
  Matches `[A-Za-z_][A-Za-z0-9_.-]*`, at most 100 characters; unique per environment (case-sensitive).
  """
  name: String!

  """
  Whether the value is a secret: sealed at rest with `secret.key`, masked in
  the UI, and left out of exports (M3) and the Assistant (M6).
  """
  secret: Boolean!

  """
  Value, at most 1 MiB (1048576 bytes of UTF-8). Secret values are returned to
  authenticated clients too; the UI masks them behind a reveal toggle.
  """
  value: String!
}

"""A variable to store; same rules as `EnvironmentVariable`."""
input EnvironmentVariableInput {
  """Variable name (see `EnvironmentVariable.name`)."""
  name: String!

  """Whether the value is a secret. Default false."""
  secret: Boolean! = false

  """Value, at most 1 MiB."""
  value: String!
}

"""
Values of `extensions.code` on GraphQL errors. Errors produced by the server's
GraphQL layer itself use `GRAPHQL_PARSE_FAILED` or `GRAPHQL_VALIDATION_FAILED`
instead. `BAD_QUERY` errors also carry `extensions.span = {start, end}`: byte
offsets (end exclusive) into the HTTPQL/StreamQL text that failed.
"""
enum ErrorCode {
  """An argument failed validation, e.g. an empty name."""
  BAD_INPUT

  """
  An HTTPQL/StreamQL query failed to parse or type-check; see `extensions.span`.
  """
  BAD_QUERY

  """The operation conflicts with the current state."""
  CONFLICT

  """
  Unexpected server failure. The message is generic; details are in the server log.
  """
  INTERNAL

  """The referenced object does not exist (any more)."""
  NOT_FOUND

  """The field is part of the contract but its feature has not landed yet."""
  NOT_IMPLEMENTED

  """Authentication is required and no valid token was presented."""
  UNAUTHENTICATED
}

"""
A named HTTPQL query that other queries reference as `preset:"Name"` or
`preset:alias`. A reference is resolved by exact name first, then by alias.
References may nest (up to depth 8) but must not form a cycle.
"""
type FilterPreset implements Node {
  """
  Optional short reference name, unique among filter presets: lowercase
  letters, digits, `-` and `_`, starting with a letter or digit
  (`[a-z0-9][a-z0-9_-]*`). Null when the preset has none.
  """
  alias: String
  id: ID!

  """Display name: trimmed, 1-200 characters, unique among filter presets."""
  name: String!

  """
  The HTTPQL text, trimmed and non-empty. May itself reference other presets.
  """
  query: String!
}

"""
A captured or sent HTTP request with its response, if any.

Edited pairs (F-HIST-4): an exchange changed by Match & Replace or Intercept is
stored as two records, both listed in history. The original holds the request
as the client sent it and the response as the server sent it. The edited record
(`editedFrom` = original, `original.editedBy` = edited) holds the request as the
server received it and the response as the client received it; when only the
response changed, both carry the same request bytes. Replay and Automate store
only what they sent and never create a pair.
"""
type HttpRequest implements Node {
  """
  A slice of the body, so large bodies can be fetched in chunks. `offset` must
  be ≥ 0 and `limit` between 1 and 4194304 (4 MiB), otherwise `BAD_INPUT`;
  past the end the result is shorter or empty. With `decode: true`, the
  `Content-Encoding` (gzip, deflate, br, zstd) and chunked transfer coding are
  removed first and `offset`/`limit` apply to the decoded bytes (display only,
  F-HIST-2); undecodable bodies are returned as stored.
  """
  body(decode: Boolean! = false, limit: Int! = 1048576, offset: Int64! = 0): Bytes!

  """Number of stored body bytes, before any decoding."""
  bodyLength: Int64!

  """Row colour; null for none."""
  color: RequestColor

  """When the request was sent or captured."""
  createdAt: Time!

  """
  On an original record, its edited record (at most one); null otherwise or
  when the edited record was deleted.
  """
  editedBy: HttpRequest

  """
  On an edited record, the original it was edited from; null otherwise or when
  the original was deleted. With `editedBy`, lets the viewer toggle Original /
  Modified.
  """
  editedFrom: HttpRequest

  """
  Extension of the last path segment including the dot (`.js`); empty when there is none.
  """
  ext: String!

  """
  Request line and headers exactly as sent, including the CRLF line endings
  and the empty line that ends the headers.
  """
  head: Bytes!

  """From the Host header, or the target when there is none. Without port."""
  host: String!

  """
  Row ID; also the HTTPQL `row.id`. Numeric, increasing in capture order.
  """
  id: ID!

  """
  Whether Intercept dropped the request or its response. A dropped request has
  no response; a dropped response keeps the server's response.
  """
  isDropped: Boolean!

  """
  Whether the stored bytes were cut at the capture size limit. `length` is the
  real size; `head`, `bodyLength` and `body` describe what was stored.
  """
  isTruncated: Boolean!

  """
  Size in bytes of the whole request as sent: request line, headers and body.
  """
  length: Int64!

  """Method token from the request line, as sent (case preserved)."""
  method: String!

  """Free-text note; null when there is none."""
  note: String

  """Path without the query string, as sent (not percent-decoded)."""
  path: String!

  """
  Port of the connection target, not of the Host header; 443/80 when implied by the scheme.
  """
  port: Int!

  """Query string without the leading `?`; empty when there is none."""
  query: String!

  """
  The response; null while the request is pending (also while the request is
  held in Intercept), or when it failed or the request was dropped. A response
  held or dropped in Intercept is the server's response and stays available
  here (F-INT-1).
  """
  response: HttpResponse

  """What produced the record (proxy, Replay, Automate, …)."""
  source: RequestSource!

  """Whether the connection to the target used TLS."""
  tls: Boolean!
}

"""A page of requests."""
type HttpRequestConnection {
  """Requests of this page, in the requested sort order."""
  edges: [HttpRequestEdge!]!

  """Cursors and whether more pages exist before or after this one."""
  pageInfo: PageInfo!

  """
  Number of requests matching `query` and `scopeId`, ignoring pagination.
  """
  totalCount: Int!
}

"""One request in a `requests` connection."""
type HttpRequestEdge {
  """
  Opaque cursor of this position in the sort order; valid for the same arguments only.
  """
  cursor: String!

  """The request at this position."""
  node: HttpRequest!
}

"""The response to an `HttpRequest`."""
type HttpResponse {
  """A slice of the body; same rules as `HttpRequest.body`."""
  body(decode: Boolean! = false, limit: Int! = 1048576, offset: Int64! = 0): Bytes!

  """Number of stored body bytes, before any decoding."""
  bodyLength: Int64!

  """Status code."""
  code: Int!

  """When the response was received."""
  createdAt: Time!

  """
  Status line and headers exactly as received, including the CRLF line
  endings and the empty line that ends the headers.
  """
  head: Bytes!

  """
  Size in bytes of the whole response as received: status line, headers and body.
  """
  length: Int64!

  """
  Milliseconds from sending the first request byte to receiving the last response byte.
  """
  roundtripMs: Int!
}

"""
A signed 64-bit integer serialized as a JSON string of its decimal form
(`"9007199254740993"`), because JSON numbers lose precision above 2^53 in
JavaScript. Inputs accept the string form or a JSON integer.
"""
scalar Int64

"""
A request or response held in the intercept queue. It stays until it is
forwarded or dropped, queuing or its side is turned off, the project is
switched, or the client disconnects (a held request then leaves the queue and
its record stays without a response). Turning queuing or a side off, and a
project switch, forward the affected items unchanged in arrival (FIFO) order;
on a project switch this happens before the new project's settings load.
"""
type InterceptItem implements Node {
  """When the item entered the queue."""
  heldAt: Time!

  """Opaque ID, valid while the item is held."""
  id: ID!

  """Whether a request or a response is held."""
  kind: InterceptItemKind!

  """
  The held message exactly as it would be sent now (after Match & Replace): the
  request for `REQUEST` items, the response for `RESPONSE` items: start line,
  headers and the body, whose size is bounded by the 64 MiB capture cap. Only
  messages up to 16 MiB in total can be edited (see `forwardInterceptItem`).
  """
  raw: Bytes!

  """
  The history record of the exchange. A held request already has its record
  (pending, no response yet), so it shows in HTTP History.
  """
  request: HttpRequest!
}

"""Which side of an exchange a held item is."""
enum InterceptItemKind {
  """A request held before it is sent upstream."""
  REQUEST

  """A response held before it is sent to the client."""
  RESPONSE
}

"""One change to the intercept queue, from `interceptQueueChanged`."""
type InterceptQueueChange {
  """The item; for `REMOVED`, as it was when it left."""
  item: InterceptItem!

  """Whether the item entered or left the queue."""
  kind: InterceptQueueChangeKind!
}

"""How the intercept queue changed."""
enum InterceptQueueChangeKind {
  """An item entered the queue."""
  ADDED

  """An item left the queue (forwarded, dropped, released or client gone)."""
  REMOVED
}

"""
Intercept settings of the selected project. A request is held iff `queuing` and
`requests` are on and it matches `query` and the `scopeId` preset; a response
iff `queuing` and `responses` are on and the exchange matches. `query` is
evaluated on the message after Match & Replace; `resp.*` clauses are false for
a request. Changing the condition does not release items already held. Only
messages whose body fits the capture cap (64 MiB) are held; larger ones pass
through.
"""
type InterceptSettings {
  """Status code the client gets for a dropped item, 100-599. Default 502."""
  dropStatusCode: Int!

  """
  HTTPQL condition deciding which traffic is held; empty (the default) holds everything.
  """
  query: String!

  """
  Queuing (true) or Forwarding (false). Not persisted: every start and every
  project switch begins in Forwarding.
  """
  queuing: Boolean!

  """Whether requests are held while queuing. Default true."""
  requests: Boolean!

  """Whether responses are held while queuing. Default false."""
  responses: Boolean!

  """
  Scope preset deciding which traffic is held; null (the default) holds everything.
  """
  scopeId: ID
}

"""
Changes to `InterceptSettings`. Omitted fields keep their value; `scopeId:
null` clears the scope. Nothing changes when any field is invalid.
"""
input InterceptSettingsInput {
  """
  Status code for dropped items, 100-599. `null` is the same as omitting the field.
  """
  dropStatusCode: Int

  """
  HTTPQL condition; `""` holds everything. `null` is the same as omitting the field.
  """
  query: String

  """
  Turning queuing off forwards every held item unchanged, in FIFO order.
  `null` is the same as omitting the field.
  """
  queuing: Boolean

  """
  Turning it off forwards the held requests unchanged, in FIFO order. `null` is
  the same as omitting the field.
  """
  requests: Boolean

  """
  Turning it off forwards the held responses unchanged, in FIFO order. `null`
  is the same as omitting the field.
  """
  responses: Boolean

  """Scope preset ID; `null` clears it (everything is in scope)."""
  scopeId: ID
}

"""Mutations. Other schema files extend this type."""
type Mutation {
  """
  Cancels the session's in-flight send, which then returns an entry with error
  `cancelled`. Returns true when a send was cancelled, false when none was in
  flight. `NOT_FOUND` for an unknown ID.
  """
  cancelReplaySend(id: ID!): Boolean!

  """
  Creates an empty, unselected project environment.
  
  Errors: `BAD_INPUT` for a name empty, longer than 200 characters or with
  control characters after trimming; `CONFLICT` when the name is `Global` or
  already used in this project.
  """
  createEnvironment(name: String!): Environment!

  """
  Creates a filter preset, placed last in preset order. `name`, `alias` and
  `query` are trimmed; an empty or null `alias` means none.
  
  Errors:
  - `BAD_INPUT`: `name` empty or longer than 200 characters; `alias` not of the
    form `[a-z0-9][a-z0-9_-]*`; `query` empty; the project already has 1000
    filter presets.
  - `CONFLICT`: another filter preset has this name, or this alias.
  - `BAD_QUERY` (with `extensions.span` into `query`): `query` does not parse,
    references a preset that does not exist, would create a reference cycle,
    or nests references deeper than 8 levels.
  """
  createFilterPreset(alias: String, name: String!, query: String!): FilterPreset!

  """
  Creates a project. `name` is trimmed and must not be empty (`BAD_INPUT`).
  When `select` is true the new project also becomes the selected one.
  """
  createProject(name: String!, select: Boolean! = false): Project!

  """
  Creates an empty collection, placed last. `BAD_INPUT` for an invalid name.
  """
  createReplayCollection(name: String!): ReplayCollection!

  """
  Creates an HTTP session with default options and no colour, placed last in
  its collection.
  
  Errors:
  - `BAD_INPUT`: both or neither of `fromRequestId` and `connection`+`raw`;
    only one of `connection` and `raw`; an invalid connection, name or `raw`;
    the history request was truncated or is larger than 16 MiB.
  - `NOT_FOUND`: unknown `collectionId` or `fromRequestId`.
  """
  createReplaySession(input: CreateReplaySessionInput!): ReplaySession!

  """
  Creates a scope preset, placed last in preset order.
  
  Errors:
  - `BAD_INPUT`: `name` empty or longer than 200 characters after trimming;
    more than 1000 entries in `allow` or in `deny`; an entry that does not
    follow the rule syntax (the message quotes the offending entry, e.g.
    `scope entry "example.com:99999": bad port "99999"`).
  - `CONFLICT`: another scope preset already has this name (exact match after trimming).
  """
  createScopePreset(allow: [String!]! = [], deny: [String!]! = [], name: String!): ScopePreset!

  """
  Deletes a project environment and its variables, and returns its ID. When it
  was selected, no environment is selected afterwards.
  
  Errors: `CONFLICT` for Global; `NOT_FOUND` for an unknown ID.
  """
  deleteEnvironment(id: ID!): ID!

  """
  Deletes a preset and returns its ID. Presets that reference it are kept;
  queries that reach the dangling reference then fail with `BAD_QUERY`.
  `NOT_FOUND` for an unknown ID.
  """
  deleteFilterPreset(id: ID!): ID!

  """
  Deletes a project and its directory, returning its ID. Deleting the selected
  project first selects the default project, or a new temporary project when the
  deleted one was the default or no default exists. `NOT_FOUND` for an unknown ID.
  """
  deleteProject(id: ID!): ID!

  """
  Deletes a collection with its sessions and their entries, and returns its ID.
  In-flight sends of those sessions are cancelled. Request records stay in
  HTTP History.
  
  Errors: `CONFLICT` for the Default collection; `NOT_FOUND` for an unknown ID.
  """
  deleteReplayCollection(id: ID!): ID!

  """
  Deletes a session with its entries and returns its ID; an in-flight send is
  cancelled. Request records stay in HTTP History. `NOT_FOUND` for an unknown ID.
  """
  deleteReplaySession(id: ID!): ID!

  """
  Deletes requests with their responses, either the given `ids` (unknown IDs
  are ignored) or everything matching the HTTPQL `query` within `scopeId`.
  Exactly one of `ids` and `query` must be given (`BAD_INPUT`); `query: ""`
  deletes all requests. Records edited from a deleted request keep existing
  with `editedFrom: null`. Returns the number deleted and emits
  `requestsDeleted`.
  """
  deleteRequests(ids: [ID!], query: String, scopeId: ID): Int64!

  """
  Deletes a preset and returns its ID. Pages that had it selected fall back to
  no scope. `NOT_FOUND` for an unknown ID.
  """
  deleteScopePreset(id: ID!): ID!

  """
  Drops every held item of `kind` (both kinds when null), as
  `dropInterceptItem`. Returns how many were dropped; emits one `REMOVED` per
  item.
  """
  dropAllInterceptItems(kind: InterceptItemKind): Int!

  """
  Drops a held item and returns its ID; emits `interceptQueueChanged`
  (`REMOVED`). The client gets `dropStatusCode` with a short HTML body and the
  record gets `isDropped`. A dropped request is never sent upstream and the
  record has no response; a dropped response keeps the server's response on
  the record. No edited record is stored. `NOT_FOUND` for an unknown ID or an
  item already released.
  """
  dropInterceptItem(id: ID!): ID!

  """
  Copies a project's data into a new, unselected project. `name` defaults to the
  source name with a " (copy)" suffix. `NOT_FOUND` for an unknown ID.
  """
  duplicateProject(id: ID!, name: String): Project!

  """
  Copies draft, connection, options and colour (not entries) into a new session
  named `<name> (copy)` (the source name cut to 193 characters first), placed
  right after the source in its collection. `NOT_FOUND` for an unknown ID.
  """
  duplicateReplaySession(id: ID!): ReplaySession!

  """
  Copies a preset's rules into a new preset named `<name> (copy)`, or
  `<name> (copy 2)`, `(copy 3)`, … when that name is taken (the source name is
  cut to 150 characters first). The copy is placed last. `NOT_FOUND` for an
  unknown ID.
  """
  duplicateScopePreset(id: ID!): ScopePreset!

  """
  Forwards every held item of `kind` (both kinds when null) unchanged, in FIFO
  order. Returns how many were forwarded; emits one `REMOVED` per item.
  """
  forwardAllInterceptItems(kind: InterceptItemKind): Int!

  """
  Releases a held item and returns its ID; emits `interceptQueueChanged`
  (`REMOVED`).
  
  `raw`, when given, replaces the held message and must parse as an HTTP/1.x
  request (or response for `RESPONSE` items) and be at most 16 MiB (16777216
  bytes) once decoded, so its base64 form fits the 32 MiB API request cap. A
  held message over 16 MiB can only be forwarded unchanged (`raw` omitted) or
  dropped. An edited exchange is stored as
  an edited record linked to the original (F-HIST-4). With
  `updateContentLength`, `Content-Length` is set to the body size when the
  message has no `Transfer-Encoding` and has a body or a `Content-Length`
  header; otherwise the bytes go out exactly as given. Editing `Host` or the
  request target never changes the destination: the request goes to the
  original connection's host, port and TLS.
  
  Errors:
  - `NOT_FOUND`: unknown ID or item already released.
  - `BAD_INPUT`: `raw` does not parse (the message quotes the parse error), is
    over 16 MiB, or is given for a held message over 16 MiB; the item stays
    held. An API request whose declared `Content-Length` exceeds the cap gets
    HTTP 413 before this mutation runs; a longer body without one (chunked)
    fails as a GraphQL error.
  """
  forwardInterceptItem(id: ID!, raw: Bytes, updateContentLength: Boolean! = true): ID!

  """
  Adds the presets of an `exportFilterPresets` document, appended in file
  order, and returns how many were added. A preset whose name already exists
  is skipped (not counted, not changed). All or nothing: on any error nothing
  is added. Imported presets may reference each other in any order.
  
  Errors:
  - `BAD_INPUT`: not valid JSON of that shape; `version` other than 1; more than
    1000 presets in the file or in the project afterwards; any preset failing
    the `createFilterPreset` field rules.
  - `CONFLICT`: a new preset's alias is already used.
  - `BAD_QUERY` (with `extensions.span` into that preset's query): a new
    preset's query does not parse, references a missing preset, or forms a cycle.
  """
  importFilterPresets(json: String!): Int!

  """
  Moves a session to position `index` (0-based) of `collectionId`, which may be
  its own collection. An `index` past the end places it last.
  
  Errors: `BAD_INPUT` for a negative `index`; `NOT_FOUND` for an unknown ID or
  `collectionId`.
  """
  moveReplaySession(collectionId: ID!, id: ID!, index: Int!): ReplaySession!

  """
  Renames a project environment. Same name rules and errors as
  `createEnvironment` (keeping its own name is not a conflict); `CONFLICT` for
  Global; `NOT_FOUND` for an unknown ID.
  """
  renameEnvironment(id: ID!, name: String!): Environment!

  """
  Renames a project and, if it was temporary, saves it. `name` is trimmed and
  must not be empty (`BAD_INPUT`). `NOT_FOUND` for an unknown ID.
  """
  renameProject(id: ID!, name: String!): Project!

  """
  Renames a collection (Default included). `BAD_INPUT` for an invalid name, `NOT_FOUND` for an unknown ID.
  """
  renameReplayCollection(id: ID!, name: String!): ReplayCollection!

  """
  Sets the preset order and returns all presets in the new order. `ids` must
  list every current filter preset exactly once: a missing, extra, unknown or
  repeated ID is `BAD_INPUT` and nothing changes.
  """
  reorderFilterPresets(ids: [ID!]!): [FilterPreset!]!

  """
  Sets the collection order and returns all collections in the new order.
  `ids` must list every collection exactly once: a missing, extra, unknown or
  repeated ID is `BAD_INPUT` and nothing changes.
  """
  reorderReplayCollections(ids: [ID!]!): [ReplayCollection!]!

  """
  Sets the preset order and returns all presets in the new order. `ids` must
  list every current scope preset exactly once: a missing, extra, unknown or
  repeated ID is `BAD_INPUT` and nothing changes.
  """
  reorderScopePresets(ids: [ID!]!): [ScopePreset!]!

  """
  Selects a project environment for the selected project, or none with
  `id: null` (only Global is used then). Returns the selected environment, or
  null when none is.
  
  Errors: `BAD_INPUT` for Global's ID (Global is always used; pass null);
  `NOT_FOUND` for an unknown ID.
  """
  selectEnvironment(id: ID): Environment

  """
  Selects a project: the old project's database is closed, the new one opened,
  and a SELECTED `projectChanged` event is emitted. Selecting the already
  selected project is a no-op. `NOT_FOUND` for an unknown ID.
  """
  selectProject(id: ID!): Project!

  """
  Sends the request and returns the stored entry once the response is
  complete, the timeout passes or the send is cancelled (`cancelReplaySend`).
  
  1. `raw`, `connection` and `options` are validated, then saved on the session
     (draft first, so nothing typed is lost even when the send fails).
  2. `{{var}}` interpolation with the selected environment, then Global
     (F-ENV-1).
  3. Match & Replace (source `replay`) when `applyMatchReplace` is on.
  4. Content-Length update when `updateContentLength` is on.
  5. The result must parse as an HTTP/1.x request head; the body is every byte
     after the blank line and is not checked against `Content-Length`.
  6. Written on a fresh connection (no pooling, closed after the exchange):
     TLS without certificate verification, SNI per `ReplayConnection.sni`,
     ALPN `http/1.1`. The timeout covers dial to the last response byte.
     Responses are read up to the 64 MiB capture cap, then cut (`isTruncated`).
  7. Redirects are followed per F-REP-2 when `followRedirects` is on.
  
  Each send stores one request record per hop (source `REPLAY`, the bytes as
  sent) and one entry. Dial, TLS, timeout and cancel failures are not GraphQL
  errors: they return an entry with `error` and no response.
  
  Errors (no entry is stored):
  - `CONFLICT`: a send of this session is already in flight.
  - `BAD_INPUT`: invalid `raw`, connection or options (nothing is saved); the
    bytes after steps 2-4 do not parse (the message quotes the parse error; the
    draft stays saved).
  - `NOT_FOUND`: unknown ID.
  """
  sendReplaySession(id: ID!, input: SendReplaySessionInput!): ReplayEntry!

  """
  Makes this project the default (opened at start), clearing the flag on any
  other project. Passing `id: null` clears the default. Temporary projects cannot
  be the default (`BAD_INPUT`). `NOT_FOUND` for an unknown ID.
  """
  setDefaultProject(id: ID): Project

  """
  Replaces the whole variable list of an environment (Global included) and
  returns it. Nothing changes on error.
  
  Errors: `BAD_INPUT` for an invalid or duplicate name (the message quotes it)
  or a value over 1 MiB; `NOT_FOUND` for an unknown ID.
  """
  setEnvironmentVariables(id: ID!, variables: [EnvironmentVariableInput!]!): Environment!

  """Sets the tag colour; null clears it. `NOT_FOUND` for an unknown ID."""
  setReplaySessionColor(color: RequestColor, id: ID!): ReplaySession!

  """
  Sets (or with `color: null` clears) the row colour of each request. Unknown
  IDs are `NOT_FOUND` and nothing changes. Returns the updated requests in
  `ids` order and emits `requestUpdated` for each.
  """
  setRequestColor(color: RequestColor, ids: [ID!]!): [HttpRequest!]!

  """
  Sets the note of a request. The note is trimmed; null or empty clears it.
  `NOT_FOUND` for an unknown ID. Emits `requestUpdated`.
  """
  setRequestNote(id: ID!, note: String): HttpRequest!

  """
  Replaces a preset's name, alias and query; its position is kept. Same
  validation and errors as `createFilterPreset` (a preset keeping its own name
  or alias is not a conflict). Renaming or re-aliasing does not rewrite other
  presets that reference the old name. `NOT_FOUND` for an unknown ID.
  """
  updateFilterPreset(alias: String, id: ID!, name: String!, query: String!): FilterPreset!

  """
  Updates the settings and returns them; emits `interceptSettingsChanged`.
  Turning `queuing`, `requests` or `responses` off forwards the affected held
  items unchanged in FIFO order.
  
  Errors:
  - `BAD_QUERY` (with span): `query` does not parse or type-check.
  - `NOT_FOUND`: unknown `scopeId`.
  - `BAD_INPUT`: `dropStatusCode` outside 100-599.
  """
  updateInterceptSettings(input: InterceptSettingsInput!): InterceptSettings!

  """
  Saves name, connection, options or draft. Allowed while sending; the send in
  flight keeps the values it started with.
  
  Errors: `BAD_INPUT` for an invalid field (nothing changes); `NOT_FOUND` for
  an unknown ID.
  """
  updateReplaySession(id: ID!, input: UpdateReplaySessionInput!): ReplaySession!

  """
  Replaces a preset's name and both rule lists; its position is kept. Same
  validation and errors as `createScopePreset` (a preset keeping its own name
  is not a conflict). `NOT_FOUND` for an unknown ID.
  """
  updateScopePreset(allow: [String!]!, deny: [String!]!, id: ID!, name: String!): ScopePreset!
}

"""
An object with a stable identifier. IDs are opaque strings, unique per type;
clients must not parse them.
"""
interface Node {
  """Opaque identifier, stable for the object's lifetime."""
  id: ID!
}

"""Relay-style page metadata."""
type PageInfo {
  """Cursor of the last edge; null for an empty page."""
  endCursor: String
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!

  """Cursor of the first edge; null for an empty page."""
  startCursor: String
}

"""One tick of the `ping` subscription."""
type Ping {
  """Server time of the tick."""
  at: Time!

  """Tick number, starting at 1 for each subscription."""
  seq: Int64!
}

"""
A project: one isolated database of captured traffic, sessions and settings.
Exactly one project is selected at any time; when none exists, a temporary one
is created.
"""
type Project implements Node {
  """When the project was created."""
  createdAt: Time!

  """Size of the project's database file in bytes."""
  dbSizeBytes: Int64!
  id: ID!

  """
  Whether this project is opened at start. At most one project is the default.
  """
  isDefault: Boolean!

  """Whether this is the currently selected project."""
  isSelected: Boolean!

  """
  Temporary projects are created when no project exists and are deleted on clean
  shutdown. Renaming a temporary project saves it (it stops being temporary).
  """
  isTemporary: Boolean!

  """When the project was last selected; null if never."""
  lastOpenedAt: Time

  """Display name. Not required to be unique."""
  name: String!
}

"""One change to the set of projects."""
type ProjectChange {
  """What happened."""
  kind: ProjectChangeKind!

  """The project after the change; null for DELETED."""
  project: Project

  """ID of the affected project."""
  projectId: ID!
}

"""What happened to a project in a `projectChanged` event."""
enum ProjectChangeKind {
  """
  A project was created (including by duplication or as a temporary project).
  """
  CREATED

  """A project was deleted. `project` is null."""
  DELETED

  """
  A different project was selected. Clients must drop all project-scoped state
  and re-run their queries and subscriptions.
  """
  SELECTED

  """A project's fields changed: name, temporary or default flag."""
  UPDATED
}

type Query {
  """The selected project. There is always one."""
  currentProject: Project!

  """
  One environment (Global or of the selected project), or null if none has this ID.
  """
  environment(id: ID!): Environment

  """
  Global first, then the selected project's environments in name order. Not paginated.
  """
  environments: [Environment!]!

  """
  All filter presets as a JSON document, in preset order, for download:
  `{"version":1,"presets":[{"name":"…","alias":"…","query":"…"}, …]}`
  (`alias` is omitted when null). `importFilterPresets` reads the same format.
  """
  exportFilterPresets: String!

  """One filter preset, or null if no preset has this ID."""
  filterPreset(id: ID!): FilterPreset

  """
  All filter presets of the selected project, in preset order (see `reorderFilterPresets`). Not paginated.
  """
  filterPresets: [FilterPreset!]!

  """
  Held items in FIFO order (oldest first), of one `kind` or, with `kind: null`,
  both. The sidebar badge is the number of held items.
  """
  interceptQueue(kind: InterceptItemKind): [InterceptItem!]!

  """Intercept settings of the selected project."""
  interceptSettings: InterceptSettings!

  """One project, or null if no project has this ID."""
  project(id: ID!): Project

  """
  All projects, most recently opened first. The list is small, so it is not paginated.
  """
  projects: [Project!]!

  """
  Autocomplete for the query bar (docs/04-query-language.md §7). `cursor` is a
  byte offset into `text` (0..len, else `BAD_INPUT`). Never fails on an
  unparsable `text`: it completes what can be inferred.
  """
  queryCompletions(cursor: Int!, language: QueryLanguage!, text: String!): QueryCompletions!

  """
  All collections of the selected project in collection order (see
  `reorderReplayCollections`), each with its sessions in position order. Never
  empty: the Default collection is created on first use. Not paginated.
  """
  replayCollections: [ReplayCollection!]!

  """One session, or null if no session has this ID."""
  replaySession(id: ID!): ReplaySession

  """One request, or null if no request has this ID."""
  request(id: ID!): HttpRequest

  """
  Requests of the selected project matching an HTTPQL `query` (empty or null
  matches everything; parse errors are `BAD_QUERY` with a span) and, when
  `scopeId` is set, the scope preset (`NOT_FOUND` for an unknown ID). Paginate
  forward with `first`/`after` or backward with `last`/`before`; `first` and
  `last` are 1..1000 and only one of them may be given (`BAD_INPUT`). With
  neither, `first: 100` is used. Default sort: ID ascending.
  """
  requests(after: String, before: String, first: Int, last: Int, query: String, scopeId: ID, sort: RequestSort): HttpRequestConnection!

  """One scope preset, or null if no preset has this ID."""
  scopePreset(id: ID!): ScopePreset

  """
  All scope presets of the selected project, in preset order (see `reorderScopePresets`). Not paginated.
  """
  scopePresets: [ScopePreset!]!

  """
  Facts about the running instance; also used by the UI as a liveness probe.
  """
  serverInfo: ServerInfo!

  """
  Children of `parentId`, or the `HOST` nodes when it is null, built from the
  requests of the selected project matching the HTTPQL `query` and `scopeId`
  (same rules and errors as `requests`). Only nodes with at least one matching
  request are returned. Order: hosts by host, then port, then non-TLS first;
  children by kind (path nodes, then `QUERY` nodes), then label in byte order.
  With `recursive: true`, every descendant of `parentId` (or the whole tree) is
  returned in depth-first pre-order, so clients can rebuild it from `parentId`;
  more than 5000 nodes is `BAD_INPUT` ("subtree has more than 5000 nodes").
  A malformed `parentId` is `BAD_INPUT`; a well-formed one whose node has no
  matching requests (any more) gives an empty list. A node `query` that would
  exceed the HTTPQL length limit is `BAD_QUERY` ("query too long").
  """
  sitemapNodes(parentId: ID, query: String, recursive: Boolean! = false, scopeId: ID): [SitemapNode!]!
}

"""Suggestions for the token at the cursor."""
type QueryCompletions {
  """Byte offset where the replaced token starts."""
  from: Int!

  """Suggestions, best first; at most 100."""
  items: [Completion!]!

  """
  Byte offset where the replaced token ends (exclusive); at least the cursor.
  """
  to: Int!
}

"""Which query language a `queryCompletions` request is about."""
enum QueryLanguage {
  """HTTP history filters (docs/04-query-language.md §1–3)."""
  HTTPQL

  """WebSocket message filters (docs/04-query-language.md §6)."""
  STREAMQL
}

"""
A folder of sessions. The "Default" collection is created with the project's
first Replay use, so `replayCollections` never returns an empty list.
"""
type ReplayCollection implements Node {
  """Opaque identifier."""
  id: ID!

  """
  Whether this is the Default collection: it can be renamed but not deleted,
  and it receives new sessions created without `collectionId`.
  """
  isDefault: Boolean!

  """Display name; see the shared name rules at the top of this file."""
  name: String!

  """
  Sessions of this collection in position order (see `moveReplaySession`).
  """
  sessions: [ReplaySession!]!
}

"""
Where a session's request goes. Editing `Host` in the request never changes it.
"""
type ReplayConnection {
  """Host name or IP address to dial."""
  host: String!

  """TCP port, 1-65535."""
  port: Int!

  """
  SNI override for TLS; null sends `host` as SNI when it is a name and no SNI
  for an IP address.
  """
  sni: String

  """Whether to speak TLS (certificates are not verified; ALPN `http/1.1`)."""
  tls: Boolean!
}

"""
A connection to store or send to. Errors: `BAD_INPUT` for an empty `host` or
one containing whitespace or control characters, a `port` outside 1-65535, or
an empty `sni` (use null for no override).
"""
input ReplayConnectionInput {
  """Host name or IP address to dial."""
  host: String!

  """TCP port, 1-65535."""
  port: Int!

  """SNI override; null (or omitted) for none."""
  sni: String

  """Whether to speak TLS."""
  tls: Boolean!
}

"""One send of a session."""
type ReplayEntry implements Node {
  """When the send started."""
  createdAt: Time!

  """
  Why the send failed (dial, TLS, timeout or cancel), as a short readable
  message, e.g. `timeout after 60000 ms` or `cancelled`; null on success. A
  failed send has no response.
  """
  error: String

  """Opaque identifier."""
  id: ID!

  """
  The request record as sent (source `REPLAY`), with its response. After
  followed redirects it is the last hop; every hop is its own record in HTTP
  History. Failed sends have a record without a response.
  """
  request: HttpRequest!
}

"""A page of entries, newest first."""
type ReplayEntryConnection {
  """Entries of this page."""
  edges: [ReplayEntryEdge!]!

  """Cursors and whether more pages exist."""
  pageInfo: PageInfo!

  """Number of entries of the session."""
  totalCount: Int!
}

"""One entry in a `ReplaySession.entries` connection."""
type ReplayEntryEdge {
  """Opaque cursor of this position; valid for the same session only."""
  cursor: String!

  """The entry at this position."""
  node: ReplayEntry!
}

"""Send options of a session."""
type ReplayOptions {
  """
  Run Match & Replace rules (source `replay`) on the request before sending. Default false.
  """
  applyMatchReplace: Boolean!

  """Follow up to 10 redirects (F-REP-2). Default false."""
  followRedirects: Boolean!

  """
  Time allowed from dial to the last response byte, 1000-300000 ms. Default 60000.
  """
  timeoutMs: Int!

  """
  Set `Content-Length` to the body size before sending (same rule as
  Intercept: only when there is no `Transfer-Encoding` and there is a body or a
  `Content-Length` header). Default true.
  """
  updateContentLength: Boolean!
}

"""
Changes to `ReplayOptions`. Omitted or null fields keep their value. `BAD_INPUT`
for `timeoutMs` outside 1000-300000; nothing changes then.
"""
input ReplayOptionsInput {
  """See `ReplayOptions.applyMatchReplace`."""
  applyMatchReplace: Boolean

  """See `ReplayOptions.followRedirects`."""
  followRedirects: Boolean

  """See `ReplayOptions.timeoutMs`; 1000-300000."""
  timeoutMs: Int

  """See `ReplayOptions.updateContentLength`."""
  updateContentLength: Boolean
}

"""
One Replay tab: a request draft, where it goes, and the sends made from it.
"""
type ReplaySession implements Node {
  """The collection holding the session."""
  collection: ReplayCollection!

  """Tag colour shown on the tab; null when none."""
  color: RequestColor

  """Where the request goes."""
  connection: ReplayConnection!

  """When the session was created."""
  createdAt: Time!

  """
  The request bytes the editor shows: exactly as last saved by
  `updateReplaySession` or `sendReplaySession` (before interpolation, Match &
  Replace or Content-Length update).
  """
  draft: Bytes!

  """
  Sends made from this session, newest first. `first` is 1..1000 (`BAD_INPUT`
  otherwise); `after` is a cursor from a previous page.
  """
  entries(after: String, first: Int! = 100): ReplayEntryConnection!

  """Opaque identifier."""
  id: ID!

  """Always `HTTP` in M2."""
  kind: ReplaySessionKind!

  """
  Display name. New sessions are named `METHOD path` from the request line,
  cut to 60 characters (`Untitled` when the bytes have no request line).
  """
  name: String!

  """Send options."""
  options: ReplayOptions!

  """Whether a send is in flight (see `sendReplaySession`)."""
  sending: Boolean!
}

"""
What a Replay session sends. WebSocket (M4) and Pipeline (M7) sessions add values then.
"""
enum ReplaySessionKind {
  """Raw HTTP/1.x request and response."""
  HTTP
}

"""
Row colour of a request (F-HIST-1). `null` wherever a colour is optional means
no colour. The UI picks the actual shades.
"""
enum RequestColor {
  BLUE
  CYAN
  GREEN
  ORANGE
  PINK
  PURPLE
  RED
  YELLOW
}

"""
Order of a `requests` connection. Ties are always broken by ID in the same
direction, so the order is total and cursors stay stable.
"""
input RequestSort {
  direction: SortDirection! = ASC
  field: RequestSortField!
}

"""Columns the history table can sort by (F-HIST-1)."""
enum RequestSortField {
  """Colour in `RequestColor` declaration order; no colour sorts as lowest."""
  COLOR
  CREATED_AT

  """Edited records (`editedFrom` set) sort after unedited ones."""
  EDITED
  EXT
  HOST
  ID
  METHOD

  """Note text; no note sorts as lowest."""
  NOTE
  PATH
  PORT
  QUERY

  """Response length in bytes; requests without a response sort as lowest."""
  RESPONSE_LENGTH

  """Roundtrip in ms; requests without a response sort as lowest."""
  ROUNDTRIP
  SOURCE

  """Response status code; requests without a response sort as lowest."""
  STATUS
  TLS
}

"""
What produced a request record. Same values as the HTTPQL `source:` clause.
"""
enum RequestSource {
  """Sent by an Automate attack."""
  AUTOMATE

  """
  The edited record of a proxied exchange the user changed in Intercept
  (F-HIST-4). The original record of the pair keeps `PROXY`.
  """
  INTERCEPT

  """Sent by a plugin."""
  PLUGIN

  """Captured by the proxy."""
  PROXY

  """Sent from a Replay session."""
  REPLAY

  """Sent by a workflow."""
  WORKFLOW
}

"""A change to one request, from `requestUpdated`."""
type RequestUpdate {
  """
  Whether the record matches the subscription's `query` and `scopeId` after
  the change. Clients drop rows that stop matching and insert rows that start
  matching.
  """
  matches: Boolean!

  """The record after the change."""
  request: HttpRequest!
}

"""Requests removed by `deleteRequests` (any client)."""
type RequestsDeleted {
  """
  IDs of deleted requests; one deletion is reported in batches of at most 1000 IDs.
  """
  ids: [ID!]!
}

"""
A named scope: which targets count as "in scope". A target is in scope when no
`deny` rule matches it and either `allow` is empty or an `allow` rule matches
it (deny wins over allow).

Rule syntax (each entry of `allow` and `deny`): `host[:port][/path]`.
- `host` is a glob, case-insensitive: `*` matches any run of characters
  (including none and including dots), `?` exactly one. Examples:
  `example.com`, `*.example.com`, `api.*.example.org`. Non-ASCII labels are
  matched in punycode. IPv6 literals are bracketed: `[::1]`, `[::1]:8443`.
- `:port` (optional) is 1-65535; without it every port matches.
- `/path` (optional) is a case-sensitive prefix of the request path; without it
  every path matches. `example.com/api` matches `/api` and `/api/v1`.
Surrounding whitespace is trimmed. Entries are stored as given.

The same preset filters stored traffic (`requests(scopeId)`, see
history.graphqls) and live traffic, with identical results.
"""
type ScopePreset implements Node {
  """
  Rules that bring targets into scope, in the order entered. Empty = everything allowed.
  """
  allow: [String!]!

  """
  Rules that take targets out of scope, in the order entered. Deny wins over allow.
  """
  deny: [String!]!
  id: ID!

  """Display name: trimmed, 1-200 characters, unique among scope presets."""
  name: String!
}

"""
What to send. The values are first saved on the session, as `updateReplaySession` would.
"""
input SendReplaySessionInput {
  """Saved as the session's connection."""
  connection: ReplayConnectionInput!

  """Merged into the session's options; null keeps them."""
  options: ReplayOptionsInput

  """The editor's bytes; saved as the draft."""
  raw: Bytes!
}

"""Build and runtime facts about the running instance."""
type ServerInfo {
  """Whether the UI/API requires a token (`--auth-token`)."""
  authRequired: Boolean!

  """
  VCS revision the binary was built from (12 hex chars, `-dirty` suffix when modified), or `unknown`.
  """
  commit: String!

  """Go toolchain the binary was built with, e.g. `go1.27.4`."""
  goVersion: String!

  """When this instance started."""
  startedAt: Time!

  """Release version, or `dev` for local builds."""
  version: String!
}

"""
One node of the sitemap tree. Counts and children depend on the `query` and
`scopeId` the node was fetched with.
"""
type SitemapNode {
  """Whether this node has children under the call's `query` and `scopeId`."""
  hasChildren: Boolean!

  """
  Host of the target, without port or brackets (for "Add host to scope").
  """
  host: String!

  """
  Opaque identifier, stable for the same host, path segments and query
  parameter names across calls and filters. Pass it as `sitemapNodes(parentId:)`.
  """
  id: ID!
  kind: SitemapNodeKind!

  """
  Text shown in the tree: `https://example.com:443` for hosts (port always
  shown, IPv6 hosts in brackets), the segment as stored for path nodes (not
  percent-decoded), `?a&b` for query nodes (names sorted, deduplicated).
  """
  label: String!

  """ID of the parent node; null for `HOST` nodes."""
  parentId: ID

  """Port of the target."""
  port: Int!

  """
  An HTTPQL expression selecting exactly the requests at or below this node
  that match the call's `query`; pass it unchanged, with the same `scopeId`,
  to `requests` (the node's table) and `deleteRequests` (delete node), and the
  result count equals `requestCount`. Clients never combine it with the query
  bar themselves (comments make textual composition unsafe): the server
  returns the node expression alone when the call's `query` is empty, or only
  whitespace and comments, else `(<node expression>) and (<call query>` + a
  newline + `)` (the newline ends a trailing `//` comment). Changes with the
  call's `query`, unlike `id`. Always parses; never empty.
  """
  query: String!

  """
  Number of requests at or below this node that match the call's `query` and `scopeId`.
  """
  requestCount: Int!

  """Whether the target uses TLS."""
  tls: Boolean!

  """
  URL for "Copy URL": the host label, then `/` and the segments joined by `/`
  for path nodes, then the query node label for query nodes.
  """
  url: String!
}

"""What a sitemap node stands for; clients pick the icon from it."""
enum SitemapNodeKind {
  """A path segment that has child path segments."""
  DIRECTORY

  """
  A path segment without child path segments (it may have `QUERY` children).
  """
  FILE

  """One `(tls, host, port)` target. Always a root."""
  HOST

  """
  Requests whose path ends at the parent path node and whose query string has
  this exact set of parameter names (values ignored). Always a leaf.
  """
  QUERY
}

"""Sort direction."""
enum SortDirection {
  ASC
  DESC
}

type Subscription {
  """
  Each item entering or leaving the intercept queue of the selected project.
  """
  interceptQueueChanged: InterceptQueueChange!

  """
  The settings after every change, by any client, including the reset to
  Forwarding on a project switch.
  """
  interceptSettingsChanged: InterceptSettings!

  """
  Emits one `Ping` per second until the client unsubscribes. The UI uses it to
  show whether the live connection is up.
  """
  ping: Ping!

  """
  Every create, update, delete and selection of a project, in the order they happen.
  The server ends this subscription if the client falls too far behind; clients
  must then resubscribe and refetch `projects`.
  """
  projectChanged: ProjectChange!

  """
  Each new request of the selected project that matches `query` and `scopeId`
  (same rules as `requests`), as it is stored. The response may arrive later
  through `requestUpdated`. The server ends the subscription if the client
  falls too far behind; clients then resubscribe and refetch.
  """
  requestAdded(query: String, scopeId: ID): HttpRequest!

  """
  Each change to an existing request: response stored, colour or note set.
  Reports every change, with `matches` telling whether the record matches
  `query` and `scopeId` afterwards. Same lag rule as `requestAdded`.
  """
  requestUpdated(query: String, scopeId: ID): RequestUpdate!

  """Requests deleted by any client. Same lag rule as `requestAdded`."""
  requestsDeleted: RequestsDeleted!
}

"""
An instant in time, serialized as an RFC 3339 string with nanoseconds in UTC,
e.g. `2026-11-18T09:30:00.123456789Z`. Inputs accept any RFC 3339 offset.
"""
scalar Time

"""
Changes to a session. Omitted or null fields keep their value; nothing changes when any field is invalid.
"""
input UpdateReplaySessionInput {
  """Replaces the whole connection."""
  connection: ReplayConnectionInput

  """Replaces the draft bytes."""
  draft: Bytes

  """New name; see the shared name rules."""
  name: String

  """Merged into the current options."""
  options: ReplayOptionsInput
}
# HTTP History page operations (T-017, F-HIST-1..3), against the contract in
# internal/api/graphql/schema/history.graphqls (T-013).

fragment HistoryRow on HttpRequest {
  id
  source
  host
  port
  tls
  method
  path
  query
  ext
  length
  createdAt
  color
  note
  isDropped
  isTruncated
  editedFrom {
    id
  }
  editedBy {
    id
  }
  response {
    code
    length
    roundtripMs
    createdAt
  }
}

# Bodies are capped at the 4 MiB per-call limit; `bodyLength` tells whether the
# viewer shows a truncated body. The pair ids let the viewer switch Original /
# Modified (F-HIST-4).
fragment HistoryMessage on HttpRequest {
  id
  editedFrom {
    id
  }
  editedBy {
    id
  }
  head
  bodyLength
  body(limit: 4194304, decode: true)
  response {
    head
    bodyLength
    body(limit: 4194304, decode: true)
  }
}

query HistoryRequests(
  $query: String
  $scopeId: ID
  $first: Int!
  $after: String
  $sort: RequestSort
) {
  requests(query: $query, scopeId: $scopeId, first: $first, after: $after, sort: $sort) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    edges {
      cursor
      node {
        ...HistoryRow
      }
    }
  }
}

query HistoryRequest($id: ID!) {
  request(id: $id) {
    ...HistoryMessage
  }
}

subscription HistoryRequestAdded($query: String, $scopeId: ID) {
  requestAdded(query: $query, scopeId: $scopeId) {
    ...HistoryRow
  }
}

subscription HistoryRequestUpdated($query: String, $scopeId: ID) {
  requestUpdated(query: $query, scopeId: $scopeId) {
    matches
    request {
      ...HistoryRow
    }
  }
}

subscription HistoryRequestsDeleted {
  requestsDeleted {
    ids
  }
}

query HistoryCompletions($text: String!, $cursor: Int!) {
  queryCompletions(language: HTTPQL, text: $text, cursor: $cursor) {
    from
    to
    items {
      label
      insertText
      kind
      detail
      isExtension
    }
  }
}

mutation HistorySetColor($ids: [ID!]!, $color: RequestColor) {
  setRequestColor(ids: $ids, color: $color) {
    id
    color
  }
}

mutation HistorySetNote($id: ID!, $note: String) {
  setRequestNote(id: $id, note: $note) {
    id
    note
  }
}

mutation HistoryDeleteRequests($ids: [ID!]!) {
  deleteRequests(ids: $ids)
}
